  <circle cx="654" cy="640" r="23.8" fill="#000"/>
  <path d="M370,640 C350,860 674,860 654,640" fill="none" stroke="#000" stroke-opacity="0.45" stroke-width="58" stroke-linecap="round" transform="translate(0 14)"/>
