  <line x1="672.0" y1="390.0" x2="697.0" y2="390.0" stroke="#8d939c" stroke-width="8" stroke-linecap="round"/>
  <line x1="634.6" y1="492.9" x2="653.7" y2="509.0" stroke="#8d939c" stroke-width="8" stroke-linecap="round"/>
  <circle cx="370" cy="640" r="66" fill="url(#nut)"/>
