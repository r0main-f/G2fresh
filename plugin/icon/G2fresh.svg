<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- G2fresh's icon (our own drawing): a module with a knob and a patch cable between two of its jacks. G2fresh.png is
       this at 1024 pixels on a transparent background, rendered by a browser (JUCE's SVG reader has no blur filter). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34373e"/><stop offset="1" stop-color="#16181b"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d4148"/><stop offset="1" stop-color="#2a2d33"/>
    </linearGradient>
    <radialGradient id="nut" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#e4e7ec"/><stop offset="0.55" stop-color="#9aa0a9"/><stop offset="1" stop-color="#5d626b"/>
    </radialGradient>
    <radialGradient id="shine" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/><stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/><feOffset dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>
  <g clip-path="url(#clip)">
  <rect x="250" y="170" width="524" height="690" rx="40" fill="url(#panel)" stroke="#4a4e56" stroke-width="4"/>
  <g filter="url(#drop)"><circle cx="512" cy="390" r="128" fill="#202226" stroke="#0d0e10" stroke-width="6"/>
  <circle cx="512" cy="390" r="96" fill="#2e3137"/><circle cx="512" cy="390" r="96" fill="url(#shine)" opacity="0.35"/>
  <line x1="512" y1="390" x2="580" y2="322" stroke="#f2f2f2" stroke-width="16" stroke-linecap="round"/></g>
